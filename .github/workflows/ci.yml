name: Quality and container checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run types
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run test:ci
      - run: npm run test:server
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASSISTANT_MODE: mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build and start production containers
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --wait --wait-timeout 180
      - name: Verify production HTTP behavior
        run: python3 docker/smoke.py
      - name: Install isolated browser acceptance tools
        run: |
          npm install --prefix "$RUNNER_TEMP/hanyu-browser" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/hanyu-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser, backup and offline behavior
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/hanyu-browser/node_modules/playwright
          SMOKE_ARTIFACTS: ${{ runner.temp }}/hanyu-browser-artifacts
        run: node docker/browser-smoke.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/hanyu-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
