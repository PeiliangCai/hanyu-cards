worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 48k;

    # Omit query strings and request bodies from access logs.
    log_format minimal '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout minimal;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Vite assets are fingerprinted. HTML, manifests and service workers revalidate.
    map "$status:$uri" $response_cache_control {
        default "no-cache";
        ~^(200|304):/assets/ "public, max-age=31536000, immutable";
        ~^[0-9]+:/api/ "no-store";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true,"service":"hanyu-web"}';
        }

        location = /api {
            return 404;
        }

        location ^~ /api/ {
            # Refresh Docker DNS after replacing an API container.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $assistant_backend http://api:8787;
            proxy_pass $assistant_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # Only a separately authenticated gateway may inject this credential.
            proxy_set_header X-Assistant-Proxy-Token "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header Cache-Control;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 10s;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        # Missing scripts/icons must not return the SPA HTML (or enter the SW cache).
        location ~* \.(?:js|css|json|webmanifest|png|jpe?g|svg|ico|woff2?|map)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
